name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,xml]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Smoke import core modules
        run: |
          python - <<'PY'
          modules = [
              "dnhealth",
              "dnhealth.util.net",
              "dnhealth.dnhealth_fhir.rest_server",
              "dnhealth.dnhealth_fhir.subscription_engine",
              "dnhealth.dnhealth_hl7v2.segment_validation",
              "dnhealth.r5.resources.encounter_history",
          ]
          for module in modules:
              __import__(module)
              print(f"{module}: OK")
          PY

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*
